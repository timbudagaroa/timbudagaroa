name: Atualizar jogos do Náutico

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install campeonato-brasileiro-api

      - run: node scripts/atualizar-jogos.js

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jogos.json
          git diff --staged --quiet || git commit -m "Atualiza jogos do Náutico automaticamente"
          git push
